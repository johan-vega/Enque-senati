name: enfoque
description: Gestión personal de tareas con Firebase. Proyecto final SENATI.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: 22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/escritorio.jpg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
